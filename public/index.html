<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MovieBox Scraper</title>
<style>
  :root {
    --bg:#0b0d10; --panel:#14181d; --edge:#232a33;
    --text:#e6e9ee; --dim:#7d8794; --hot:#ff5722; --hot2:#ffb27a;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    min-height:100vh;
  }
  header {
    padding:20px 24px; border-bottom:1px solid var(--edge);
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    position:sticky; top:0; background:rgba(11,13,16,0.94);
    backdrop-filter:blur(8px); z-index:10;
  }
  header h1 { margin:0; font-size:15px; color:var(--hot); font-weight:600; }
  header h1 span { color:var(--dim); font-weight:400; }
  form { display:flex; gap:8px; flex:1; min-width:280px; }
  input {
    flex:1; background:var(--panel); border:1px solid var(--edge);
    color:var(--text); padding:10px 12px; border-radius:6px;
    font:inherit; outline:none; transition:border-color .15s;
  }
  input:focus { border-color:var(--hot); }
  button {
    background:var(--hot); color:#0b0d10; border:0; padding:10px 18px;
    border-radius:6px; font:inherit; font-weight:600; cursor:pointer;
  }
  button:hover { filter:brightness(1.15); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  main { padding:20px 24px; }
  .status { color:var(--dim); margin-bottom:16px; font-size:13px; }
  .status.err { color:#ff5c5c; }
  .status b { color:var(--hot2); }
  .grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:16px;
  }
  .card {
    background:var(--panel); border:1px solid var(--edge); border-radius:8px;
    overflow:hidden; cursor:pointer; transition:border-color .15s, transform .15s;
    display:flex; flex-direction:column;
  }
  .card:hover { border-color:var(--hot); transform:translateY(-2px); }
  .card .poster {
    aspect-ratio:2/3; background:#0a0c0f center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:11px;
  }
  .card .meta { padding:10px; }
  .card .t {
    font-size:13px; font-weight:600; line-height:1.3; margin-bottom:4px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card .y { color:var(--dim); font-size:11px; }

  .drawer {
    position:fixed; inset:0; background:rgba(0,0,0,.72); display:none;
    z-index:50; align-items:center; justify-content:center; padding:20px;
  }
  .drawer.open { display:flex; }
  .drawer .panel {
    background:var(--panel); border:1px solid var(--edge); border-radius:10px;
    max-width:820px; width:100%; max-height:90vh; overflow:auto;
    padding:24px; position:relative;
  }
  .drawer .close {
    position:absolute; top:10px; right:10px; background:transparent;
    color:var(--dim); font-size:20px; padding:4px 10px;
  }
  .drawer .close:hover { color:var(--hot); }
  .drawer h2 { margin:0 0 8px; font-size:18px; color:var(--hot2); }
  .drawer .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .drawer .syn { margin:14px 0; line-height:1.6; color:#cfd6e0; }
  .drawer .genres { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .drawer .genres span {
    background:var(--edge); padding:3px 8px; border-radius:4px;
    font-size:11px; color:var(--hot2);
  }
  .streams h3 {
    font-size:12px; color:var(--dim); text-transform:uppercase;
    letter-spacing:1px; margin:16px 0 8px;
  }
  .stream {
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    background:#0f1216; border:1px solid var(--edge); border-radius:5px;
    margin-bottom:6px; font-size:12px;
  }
  .stream .q {
    background:var(--hot); color:#0b0d10; padding:2px 6px;
    border-radius:3px; font-size:10px; font-weight:700;
  }
  .stream .url {
    flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:#a8b2bf;
  }
  .stream a { color:var(--hot2); text-decoration:none; font-size:11px; }
  .stream a:hover { text-decoration:underline; }
  .spinner {
    display:inline-block; width:12px; height:12px;
    border:2px solid var(--dim); border-top-color:var(--hot);
    border-radius:50%; animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:6px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>moviebox<span>_api</span></h1>
  <form id="form">
    <input id="input" type="text"
      placeholder="paste a moviebox link, or type to search..."
      autocomplete="off" />
    <button id="go" type="submit">strike</button>
  </form>
</header>

<main>
  <div class="status" id="status">
    paste a moviebox link — e.g. <b>moviebox.ph/movie/inception-12345</b> — or just type a title.
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="drawer" id="drawer">
  <div class="panel">
    <button class="close" id="close">&times;</button>
    <div id="body"></div>
  </div>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const statusEl = $("#status"), gridEl = $("#grid"),
      drawer = $("#drawer"), body = $("#body"), go = $("#go");

function setStatus(html, err) {
  statusEl.innerHTML = html;
  statusEl.classList.toggle("err", !!err);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("#input").value.trim();
  if (!v) return;
  go.disabled = true;
  gridEl.innerHTML = "";
  setStatus('<span class="spinner"></span>striking...');

  try {
    const r = await fetch("/api/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: v }),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    if (d.mode === "detail") {
      setStatus("detail pulled: <b>" + esc(d.title) + "</b>");
      openDetail(d);
    } else {
      if (!d.count) { setStatus("no ore found for <b>" + esc(v) + "</b>"); return; }
      setStatus("found <b>" + d.count + "</b> titles. click one.");
      renderGrid(d.results);
    }
  } catch (err) {
    setStatus("strike failed: " + esc(err.message), true);
  } finally {
    go.disabled = false;
  }
});

function renderGrid(items) {
  gridEl.innerHTML = "";
  for (const it of items) {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `
      <div class="poster" ${it.poster ? `style="background-image:url('${esc(it.poster)}')"` : ""}>
        ${it.poster ? "" : "no poster"}
      </div>
      <div class="meta">
        <div class="t">${esc(it.title || "(untitled)")}</div>
        <div class="y">${esc(it.year || "")} ${it.type === "series" ? "· series" : ""}</div>
      </div>`;
    c.addEventListener("click", () => loadDetail(it.subjectId, it.type, it.title));
    gridEl.appendChild(c);
  }
}

async function loadDetail(id, type, title) {
  drawer.classList.add("open");
  body.innerHTML = '<span class="spinner"></span>pulling detail...';
  try {
    const r = await fetch(`/api/detail?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type || "movie")}`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    openDetail(d);
  } catch (e) {
    body.innerHTML = '<div class="status err">detail failed: ' + esc(e.message) + '</div>';
  }
}

function openDetail(d) {
  drawer.classList.add("open");
  const genres = (d.genres || []).map(g => `<span>${esc(g)}</span>`).join("");
  const streams = (d.streams || []).map(s => `
    <div class="stream">
      <span class="q">${esc(s.quality || "?")}</span>
      <span class="url" title="${esc(s.url)}">${esc(s.url)}</span>
      <a href="/api/proxy?url=${encodeURIComponent(s.url)}" target="_blank">open</a>
    </div>`).join("") ||
    '<div class="status">no streams returned. check play-info endpoint.</div>';

  const seasons = (d.seasons || []).length
    ? `<div class="streams"><h3>seasons</h3>${d.seasons.map(s =>
        `<div class="stream"><span class="q">S${s.season}</span>
         <span class="url">${s.episodes} episodes</span></div>`).join("")}</div>`
    : "";

  body.innerHTML = `
    <h2>${esc(d.title || "(untitled)")}</h2>
    <div class="sub">${esc(d.year || "")} ${d.rating ? "· ★ " + esc(d.rating) : ""} ${d.type === "series" ? "· series" : ""}</div>
    ${genres ? `<div class="genres">${genres}</div>` : ""}
    ${d.synopsis ? `<div class="syn">${esc(d.synopsis)}</div>` : ""}
    ${seasons}
    <div class="streams">
      <h3>streams (${(d.streams || []).length})</h3>
      ${streams}
    </div>`;
}

$("#close").addEventListener("click", () => drawer.classList.remove("open"));
drawer.addEventListener("click", e => { if (e.target === drawer) drawer.classList.remove("open"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") drawer.classList.remove("open"); });
</script>
</body>
</html>
